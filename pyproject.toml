[project]
name = "varin-evals"
version = "0.1.0"
description = "Reproducible benchmark integrations for the native Varin harness"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = ["harbor==0.25.0"]

[project.optional-dependencies]
research = ["requests>=2.31.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["varin_evals"]
